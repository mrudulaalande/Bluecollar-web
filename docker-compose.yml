version: '3.8'

services:
  backend:
    build: .
    container_name: bluecollar_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bluecollar.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    volumes:
      - ./uploads:/app/uploads
      - ./bluecollar.db:/app/bluecollar.db
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    networks:
      - bluecollar_network

  frontend:
    build: .
    container_name: bluecollar_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - bluecollar_network

networks:
  bluecollar_network:
    driver: bridge

volumes:
  uploads:
  database:
